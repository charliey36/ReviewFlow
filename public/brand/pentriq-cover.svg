<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="t d">
  <title id="t">Pentriq cover</title>
  <desc id="d">Dark green banner with the Pentriq logo, the tagline "Reviews, rebookings and referrals on autopilot", and a sample five-star review card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="0.6" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <path id="star" d="M0,-10 L2.94,-4.05 L9.51,-3.09 L4.76,1.55 L5.88,8.09 L0,5 L-5.88,8.09 L-4.76,1.55 L-9.51,-3.09 L-2.94,-4.05 Z"/>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <rect width="1600" height="500" fill="url(#glow)"/>

  <!-- Logo lockup -->
  <rect x="96" y="80" width="64" height="64" rx="16" fill="url(#tile)"/>
  <g transform="translate(110.4 94.4) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.44 2.56 2.75 9.77c-.7.27-.69 1.28.02 1.53l6.9 2.44c.32.11.57.36.68.68l2.44 6.9c.25.71 1.26.72 1.53.02l7.21-18.69c.24-.63-.4-1.27-1.03-1.03z"/>
    <path d="M21.4 2.6 9.7 14.3"/>
  </g>
  <text x="180" y="127" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Pentr<tspan fill="#6ee7b7">iq</tspan></text>

  <!-- Headline -->
  <text font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="60" letter-spacing="-1.5" fill="#ffffff">
    <tspan x="96" y="265">Reviews, rebookings</tspan>
    <tspan x="96" y="337">and referrals on <tspan fill="#6ee7b7">autopilot</tspan></tspan>
  </text>
  <text x="96" y="395" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#a7f3d0">Automated review requests and retention for service businesses.</text>

  <!-- Review card -->
  <g filter="url(#shadow)" transform="rotate(3 1230 250)">
    <rect x="1000" y="110" width="460" height="250" rx="24" fill="#ffffff"/>
    <circle cx="1058" cy="172" r="26" fill="#d1fae5"/>
    <text x="1058" y="181" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#047857">A</text>
    <text x="1100" y="167" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Alex M.</text>
    <text x="1100" y="193" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">Google review</text>
    <g fill="#f59e0b" transform="translate(1062 240) scale(2.6)">
      <use href="#star" x="0" y="0"/><use href="#star" x="22" y="0"/><use href="#star" x="44" y="0"/><use href="#star" x="66" y="0"/><use href="#star" x="88" y="0"/>
    </g>
    <text font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#334155">
      <tspan x="1040" y="293">Friendly, quick and great value.</tspan>
      <tspan x="1040" y="320">Already booked my next visit!</tspan>
    </text>
  </g>
</svg>
