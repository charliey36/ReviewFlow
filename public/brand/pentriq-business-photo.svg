<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">Illustrated local business storefront</title>
  <desc id="d">Illustration of a friendly high-street shop with a green striped awning, an open sign and a five-star review bubble.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <pattern id="stripes" width="80" height="90" patternUnits="userSpaceOnUse">
      <rect width="40" height="90" fill="#059669"/>
      <rect x="40" width="40" height="90" fill="#ecfdf5"/>
    </pattern>
    <path id="star" d="M0,-10 L2.94,-4.05 L9.51,-3.09 L4.76,1.55 L5.88,8.09 L0,5 L-5.88,8.09 L-4.76,1.55 L-9.51,-3.09 L-2.94,-4.05 Z"/>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky, clouds, street -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="190" cy="120" rx="90" ry="28"/><ellipse cx="250" cy="106" rx="60" ry="26"/>
    <ellipse cx="960" cy="90" rx="80" ry="24"/><ellipse cx="1020" cy="78" rx="50" ry="22"/>
  </g>
  <rect y="690" width="1200" height="110" fill="#94a3b8"/>
  <rect y="670" width="1200" height="30" fill="#cbd5e1"/>
  <g fill="#ffffff" opacity="0.7"><rect x="80" y="745" width="120" height="8" rx="4"/><rect x="340" y="745" width="120" height="8" rx="4"/><rect x="600" y="745" width="120" height="8" rx="4"/><rect x="860" y="745" width="120" height="8" rx="4"/></g>

  <!-- Neighbouring buildings -->
  <rect x="0" y="230" width="190" height="445" fill="#cbd5e1"/>
  <rect x="1010" y="270" width="190" height="405" fill="#d1d5db"/>
  <g fill="#e2e8f0"><rect x="30" y="270" width="50" height="70" rx="4"/><rect x="110" y="270" width="50" height="70" rx="4"/><rect x="1040" y="310" width="50" height="70" rx="4"/><rect x="1120" y="310" width="50" height="70" rx="4"/></g>

  <!-- Shop -->
  <rect x="190" y="190" width="820" height="485" fill="#f8fafc"/>
  <rect x="190" y="190" width="820" height="70" fill="#064e3b"/>
  <text x="600" y="239" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="6" fill="#ecfdf5">YOUR LOCAL BUSINESS</text>

  <!-- Awning -->
  <g filter="url(#shadow)">
    <rect x="170" y="260" width="860" height="90" fill="url(#stripes)"/>
    <g fill="#059669"><path d="M170 350h80a40 20 0 0 1-80 0z"/><path d="M330 350h80a40 20 0 0 1-80 0z"/><path d="M490 350h80a40 20 0 0 1-80 0z"/><path d="M650 350h80a40 20 0 0 1-80 0z"/><path d="M810 350h80a40 20 0 0 1-80 0z"/><path d="M970 350h60v0a30 20 0 0 1-60 0z"/></g>
    <g fill="#ecfdf5"><path d="M250 350h80a40 20 0 0 1-80 0z"/><path d="M410 350h80a40 20 0 0 1-80 0z"/><path d="M570 350h80a40 20 0 0 1-80 0z"/><path d="M730 350h80a40 20 0 0 1-80 0z"/><path d="M890 350h80a40 20 0 0 1-80 0z"/></g>
  </g>

  <!-- Windows -->
  <rect x="230" y="400" width="320" height="230" rx="10" fill="url(#glass)" stroke="#475569" stroke-width="8"/>
  <rect x="650" y="400" width="320" height="230" rx="10" fill="url(#glass)" stroke="#475569" stroke-width="8"/>
  <path d="M260 600 330 430" stroke="#ffffff" stroke-opacity="0.6" stroke-width="14" stroke-linecap="round"/>
  <path d="M680 600 750 430" stroke="#ffffff" stroke-opacity="0.6" stroke-width="14" stroke-linecap="round"/>
  <!-- Window displays -->
  <rect x="270" y="560" width="240" height="14" rx="4" fill="#92400e"/>
  <rect x="300" y="505" width="46" height="55" rx="8" fill="#10b981"/><rect x="360" y="480" width="46" height="80" rx="8" fill="#34d399"/><rect x="420" y="520" width="46" height="40" rx="8" fill="#059669"/>
  <rect x="690" y="560" width="240" height="14" rx="4" fill="#92400e"/>
  <circle cx="750" cy="525" r="34" fill="#fcd34d"/><circle cx="750" cy="525" r="22" fill="#f59e0b"/>
  <rect x="820" y="495" width="80" height="65" rx="8" fill="#6ee7b7"/>

  <!-- Door -->
  <rect x="560" y="400" width="80" height="275" rx="8" fill="#065f46" stroke="#022c22" stroke-width="6"/>
  <rect x="574" y="418" width="52" height="120" rx="6" fill="url(#glass)"/>
  <circle cx="620" cy="560" r="6" fill="#fcd34d"/>
  <!-- Open sign -->
  <g transform="translate(600 585)">
    <rect x="-34" y="-17" width="68" height="34" rx="6" fill="#022c22"/>
    <text text-anchor="middle" y="6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#6ee7b7">OPEN</text>
  </g>

  <!-- Planters -->
  <g><rect x="190" y="620" width="34" height="55" rx="6" fill="#b45309"/><circle cx="207" cy="610" r="24" fill="#22c55e"/><circle cx="190" cy="625" r="16" fill="#16a34a"/></g>
  <g><rect x="976" y="620" width="34" height="55" rx="6" fill="#b45309"/><circle cx="993" cy="610" r="24" fill="#22c55e"/><circle cx="1010" cy="625" r="16" fill="#16a34a"/></g>

  <!-- Review bubble -->
  <g filter="url(#shadow)" transform="translate(0 -62)">
    <path d="M820 70h280a24 24 0 0 1 24 24v110a24 24 0 0 1-24 24H940l-40 36 8-36h-88a24 24 0 0 1-24-24V94a24 24 0 0 1 24-24z" fill="#ffffff"/>
    <g fill="#f59e0b" transform="translate(866 118) scale(2.4)">
      <use href="#star" x="0" y="0"/><use href="#star" x="22" y="0"/><use href="#star" x="44" y="0"/><use href="#star" x="66" y="0"/><use href="#star" x="88" y="0"/>
    </g>
    <text x="846" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">"Brilliant service!"</text>
  </g>
</svg>
